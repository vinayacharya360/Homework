<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Homework Solver</title>
<style>
body{font-family:Arial;background:#f4f6fb;margin:0;padding:0}
.container{max-width:800px;margin:40px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.08)}
textarea{width:100%;height:120px;padding:10px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
button{margin-top:15px;width:100%;padding:12px;background:#4f46e5;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
#result{white-space:pre-wrap;margin-top:20px;padding:15px;background:#f1f5ff;border-radius:8px}
</style>
</head>

<body>
<div class="container">
<h2>📚 AI Homework Solver (Free Demo)</h2>
<p>Type your homework question below</p>

<textarea id="question" placeholder="Type your question..."></textarea>
<button onclick="solve()">Solve Now</button>

<div id="result"></div>
</div>

<script>
function solve(){
const q=document.getElementById("question").value;
const result=document.getElementById("result");

if(!q){
result.innerHTML="Please enter a question.";
return;
}

result.innerHTML="Solving...";

setTimeout(()=>{
if(q.includes("2+2")){
result.innerHTML="Step 1: 2 + 2\nStep 2: Add numbers\nAnswer: 4";
}
else if(q.toLowerCase().includes("hello")){
result.innerHTML="Hello! This is your AI Homework Demo.";
}
else{
result.innerHTML="Step 1: Understand the question.\nStep 2: Break into parts.\nStep 3: Solve logically.\n\nDemo Answer: This is a free demo AI. Upgrade for real AI.";
}
},1000);
}
</script>

</body>
</html>
