<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Homework Solver</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;margin:0;padding:0}
.container{max-width:800px;margin:40px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
h1{text-align:center}
textarea{width:100%;height:120px;padding:10px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
input[type=file]{margin-top:10px}
button{margin-top:15px;width:100%;padding:12px;background:#4f46e5;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
button:hover{background:#4338ca}
#result{white-space:pre-wrap;margin-top:20px;padding:15px;background:#f1f5ff;border-radius:8px}
</style>
</head>
<body>
<div class="container">
<h1>📚 AI Homework Solver</h1>
<p>Type your question or upload homework image/PDF</p><textarea id="question" placeholder="Type homework question here..."></textarea><input type="file" id="fileInput" accept="image/*,.pdf">
<button onclick="solveHomework()">Solve Now</button><div id="result"></div>
</div><script>
async function solveHomework(){
    const question=document.getElementById('question').value;
    const file=document.getElementById('fileInput').files[0];
    const resultBox=document.getElementById('result');
    resultBox.innerHTML='Solving...';

    const formData=new FormData();
    formData.append('question',question);
    if(file) formData.append('file',file);

    try{
        const res=await fetch('/api/solve',{
            method:'POST',
            body:formData
        });
        const data=await res.json();
        resultBox.innerHTML=data.answer||'No answer returned';
    }catch(err){
        resultBox.innerHTML='Error connecting to AI server';
    }
}
</script></body>
</html>
